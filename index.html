<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Geist+Mono:wght@500&family=Manrope:wght@800&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PODeq MAX: 3D model</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="PODeq MAX Rev G proposal: 3D model for engineering review. Concept, not tested hardware."><style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05070C;color:#fff;font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}
